name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Synchronisation agenda (ICS frama.space)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Générer actus.json depuis les fichiers actus/*.txt
        run: |
          cat > /tmp/gen.js << 'EOF'
          const fs = require("fs");
          const dir = "actus";
          const out = [];
          const petites = new Set(["de","du","des","la","le","les","et","a","au","aux","en","d","l"]);
          const elision = ["d","l","s","n","j","qu","c","m","t"];
          function capWord(p) {
            if (p.length === 0) return p;
            if (p === p.toUpperCase() && p.length <= 6) return p;
            return p.charAt(0).toUpperCase() + p.slice(1);
          }
          function capitalize(t) {
            return t.split(" ").map(function(w, i) {
              if (w.length === 0) return w;
              var m2 = w.split("'");
              if (m2.length > 1 && elision.indexOf(m2[0].toLowerCase()) !== -1) {
                return m2[0].toLowerCase() + "'" + m2.slice(1).map(capWord).join("'");
              }
              if (i > 0 && petites.has(w.toLowerCase())) return w.toLowerCase();
              return capWord(w);
            }).join(" ");
          }
          for (const f of fs.readdirSync(dir)) {
            if (!/\.txt$/i.test(f)) continue;
            const txt = fs.readFileSync(dir + "/" + f, "utf8").trim();
            if (!txt) continue;
            const lignes = txt.split("\n");
            const m3 = f.match(/^(\d{4})-(\d{2})-(\d{2})/);
            let titre = f.replace(/\.txt$/i, "").replace(/^\d{4}-\d{2}-\d{2}-/, "").replace(/[-_]+/g, " ");
            titre = capitalize(titre.trim());
            let categorie = "";
            let texte = txt;
            if (lignes.length > 1 && lignes[0].trim().length > 0 && lignes[0].length < 60) {
              categorie = lignes[0].trim();
              texte = lignes.slice(1).join("\n").trim();
            }
            out.push({ titre: titre, categorie: categorie, texte: texte,
              date: m3 ? m3[0] : null, jour: m3 ? parseInt(m3[3], 10) : null, mois: m3 ? parseInt(m3[2], 10) : null });
          }
          out.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
          fs.writeFileSync("actus.json", JSON.stringify(out, null, 1));
          console.log("actus.json genere :", out.length, "actus");
          EOF
          node /tmp/gen.js
          cat actus.json | head -c 300

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
